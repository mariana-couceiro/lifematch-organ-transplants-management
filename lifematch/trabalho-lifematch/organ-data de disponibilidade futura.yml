info:
  name: organ-data de disponibilidade futura
  type: http

http:
  method: POST
  url: http://localhost:8080/lifematch/api/organs
  body:
    type: json
    data: |-
      {
        "type": "Kidney",
        "bloodType": "A+",
        "donorName": "Ana Silva",
        "donorBirthDate": "1980-05-20",
        "hospital": "Hospital de Santa Maria",
        "availabilityDate": "2030-01-01",
        "status": "AVAILABLE"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
