<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>LifeMatch | Organ Type</title>

    <link rel="stylesheet"
            href="../css/style.css">
</head>

<body>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">

        <header class="page-header">

            <h1 id="organTypeFormTitle">
                New Organ Type
            </h1>

            <p>
                Organ type information
            </p>

        </header>


        <section class="content-section form-section">

            <form id="organTypeForm">

                <div class="form-grid">


                    <div class="form-group">

                        <label for="name">
                            Name
                        </label>

                        <input type="text"
                                id="name"
                                required>

                    </div>


                    <div class="form-group">

                        <label for="priorityPoints">
                            Priority Points
                        </label>

                        <select id="priorityPoints"
                                required>

                            <option value="">
                                Select
                            </option>

                            <option value="0">
                                0
                            </option>

                            <option value="1">
                                1
                            </option>

                            <option value="2">
                                2
                            </option>

                            <option value="3">
                                3
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="active">
                            Status
                        </label>

                        <select id="active"
                                required>

                            <option value="true">
                                Active
                            </option>

                            <option value="false">
                                Inactive
                            </option>

                        </select>

                    </div>


                </div>


                <div class="form-actions">

                    <a href="organ-types.html"
                        class="button secondary-button">
                        Cancel
                    </a>

                    <button type="submit"
                            class="button primary-button">
                        Create Organ Type
                    </button>

                </div>

            </form>

        </section>

    </main>


    <script src="../js/navigation.js"></script>
    <script src="../js/organ-type-form.js"></script>

</body>

</html>
