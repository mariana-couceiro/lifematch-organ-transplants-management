<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LifeMatch - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">

        <div class="page-header">

            <div>
                <h1>Dashboard</h1>
                <p>Overview of the LifeMatch system</p>
            </div>

        </div>


        <div class="dashboard-cards">

            <div class="card">

                <p class="card-title">
                    Waiting Candidates
                </p>

                <p
                    class="card-number"
                    id="candidateCount"
                >
                    0
                </p>

            </div>


            <div class="card">

                <p class="card-title">
                    Correspondences
                </p>

                <p
                    class="card-number"
                    id="correspondenceCount"
                >
                    0
                </p>

            </div>


            <div class="card">

                <p class="card-title">
                    Match Success Rate
                </p>

                <p
                    class="card-number"
                    id="successRate"
                >
                    0%
                </p>

            </div>

        </div>


        <section class="content-section">

            <div class="section-header">

                <div>
                    <h2>Recent Activity</h2>
                    <p>Latest matching activity</p>
                </div>

            </div>


            <div id="recentActivity">

                <p class="empty-state">
                    No recent activity.
                </p>

            </div>

        </section>

    </main>


    <script src="js/navigation.js"></script>
    <script src="js/dashboard.js"></script>

</body>

</html>
