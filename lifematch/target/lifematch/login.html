<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>Login | LifeMatch</title>

    <link rel="stylesheet"
            href="css/style.css">
</head>

<body>

    <main class="login-page">

        <section class="login-card">

            <!-- LOGO -->
            <div class="login-brand">

                <img
                    src="images/logo-square.png"
                    alt="LifeMatch - making tomorrow possible"
                    class="login-logo"
                >

            </div>

            <!-- HEADER -->
            <div class="login-header">

                <h2>Welcome back</h2>

                <p>
                    Sign in to access the LifeMatch
                    management system.
                </p>

            </div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        autocomplete="username"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        enterkeyhint="go"
                        required
                    >

                </div>

                <!-- ERROR MESSAGE -->
                <p
                    id="loginMessage"
                    role="alert"
                    aria-live="polite">
                </p>

                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    id="loginButton"
                    class="button primary-button">

                    Sign in

                </button>

            </form>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
