<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>LifeMatch | Organs</title>

    <link rel="stylesheet"
            href="../css/style.css">
</head>

<body>

    <aside class="sidebar">

        <div class="logo-container">
            <img src="../images/logo-horizontal.png"
                    alt="LifeMatch"
                    class="logo">
        </div>

        <nav class="menu">

            <a href="../index.html"
                class="menu-item">
                Dashboard
            </a>

            <a href="candidates.html"
                class="menu-item">
                Candidates
            </a>

            <a href="organs.html"
                class="menu-item active">
                Organs
            </a>

            <a href="correspondences.html"
                class="menu-item">
                Correspondences
            </a>

        </nav>

    </aside>

    <main class="main-content">

        <header class="page-header header-actions">

            <div>
                <h1>Organs</h1>
                <p>Manage available organs</p>
            </div>

            <a href="organ-form.html"
                class="button primary-button">
                New Organ
            </a>

        </header>

        <section class="content-section">

            <div class="table-container">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Type</th>
                            <th>Blood Type</th>
                            <th>Donor Code</th>
                            <th>Hospital</th>
                            <th>Available Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="organTableBody">
                    </tbody>

                </table>

            </div>

        </section>

    </main>

    <script src="../js/organs.js"></script>

</body>

</html>
