<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>LifeMatch | Correspondences</title>

    <link rel="stylesheet"
            href="../css/style.css">
</head>

<body>

    <aside class="sidebar">

        <div class="logo-container">

        <nav class="menu">

            <a href="candidates.html"

            <a href="organs.html"

            </a>

            <a href="correspondences.html"
